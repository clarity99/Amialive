services:
  amialive:
    image: ghcr.io/clarity99/amialive:latest
    # build: .          # uncomment to build locally instead of pulling
    restart: unless-stopped
    env_file: .env
    volumes:
      - amialive-data:/data
      - ./contacts.json:/config/contacts.json:ro
    networks: [proxy]
    healthcheck:
      test: ["CMD", "/amialive", "-healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      # Only the check-in page is exposed; /healthz stays internal.
      traefik.http.routers.amialive.rule: Host(`alive.h1t.robertivanc.com`) && Path(`/ok`)
      # Adjust to your Traefik static config (entrypoint / cert resolver names).
      traefik.http.routers.amialive.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.amialive.tls: "true"
      traefik.http.routers.amialive.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.services.amialive.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true

volumes:
  amialive-data:
